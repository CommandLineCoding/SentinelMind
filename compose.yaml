version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: sentinelmind_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false            # Disabled for rapid offline dev/testing
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic # Fixed setting
      - ES_JAVA_OPTS=-Xms512m -Xmx512m          # Memory cap for local dev
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelmind_backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  esdata:
    driver: local